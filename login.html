<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #0b0f12;
      color: white;
    }
  </style>
  <body>
    <div class="login-page">
      <div class="car-background"></div>
      <div class="login-panel">
        <a href="index.html">
          <img src="md logo.png" alt="" width="200" />
        </a>

        <div class="login-content">
          <div class="red-line"></div>
          <h1>Welcome <span>Back</span></h1>
          <p class="description">
            Log in to your MDrive account and continue your journey with us.
          </p>
          <form action="dashboard.html" method="get">
            <div class="input-box">
              <span class="input-icon">&#9993;</span>
              <input type="email" placeholder="Email Address" required />
            </div>
            <div class="input-box">
              <svg class="lock-icon" viewBox="0 0 24 24">
                <path
                  d="M6 10V8a6 6 0 0 1 12 0v2h1v12H5V10h1zm2 0h8V8a4 4 0 0 0-8 0v2z"
                />
              </svg>
              <input type="password" placeholder="Password" required />
            </div>
            <div class="login-options">
              <label class="remember">
                <input type="checkbox" />
                <span>Remember me</span>
              </label>
              <a href="#" class="forgot"> Forgot password? </a>
            </div>
            <button type="submit" class="login-button">
              Log In
              <span>&rarr;</span>
            </button>
          </form>
          <div class="divider">
            <span></span>
            <p>OR</p>
            <span></span>
          </div>
          <div class="social-login">
            <a href="#" class="social-button">
              <span class="google">G</span>
              Continue with Google
            </a>
            <a href="#" class="social-button">
              <span class="apple">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="white">
                  <path
                    d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.53 4.08zM12.03 7.25C11.88 5.02 13.69 3.18 15.86 3c.3 2.58-2.34 4.5-3.83 4.25z"
                  />
                </svg>
              </span>
              Continue with Apple
            </a>
          </div>
          <p class="create-account">
            Don't have an account?
            <a href="create.html"> Create an account &rarr; </a>
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
